name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./macos/build.sh
      - name: Zip app
        run: cd macos/build && ditto -c -k --keepParent Diskbloom.app Diskbloom.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Diskbloom-macos
          path: macos/build/Diskbloom.zip
      - name: Screenshot (smoke test)
        run: |
          DISKBLOOM_SCAN="$HOME" macos/build/Diskbloom.app/Contents/MacOS/Diskbloom &
          APP_PID=$!
          sleep 45
          kill -0 "$APP_PID"   # app se nije srusila
          screencapture -x macos/build/screenshot.png
          kill "$APP_PID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: macos/build/screenshot.png
