name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./macos/build.sh
      - name: Zip app
        run: cd macos/build && ditto -c -k --keepParent Diskbloom.app Diskbloom.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Diskbloom-macos
          path: macos/build/Diskbloom.zip
      - name: Screenshots (smoke test)
        run: |
          APP=macos/build/Diskbloom.app
          OUT=macos/build/shots; mkdir -p $OUT
          # 1) pregled diska sa akcijama
          open --env DISKBLOOM_OVERVIEW=1 "$APP"
          sleep 12
          pgrep -x Diskbloom   # app se nije srusila
          screencapture -x $OUT/1-overview.png
          pkill -x Diskbloom; sleep 2
          # 2) skeniranje + korpa
          open --env DISKBLOOM_DEMO=1 --env DISKBLOOM_SCAN="$HOME" "$APP"
          sleep 45
          pgrep -x Diskbloom
          screencapture -x $OUT/2-map.png
          # 3) klik na drugi folder u listi desno -> treba da udje u njega
          swift macos/ci/click.swift 800 202 || true
          sleep 3
          screencapture -x $OUT/3-after-click.png
          pkill -x Diskbloom || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: macos/build/shots
