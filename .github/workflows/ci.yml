name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos-app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: ./macos/build.sh
      - name: Swift tests
        run: cd macos && swift test
      - name: Check hardened runtime
        run: |
          codesign -dv --verbose=2 macos/build/Diskbloom.app 2>&1 | tee /dev/stderr | grep -q "flags=.*runtime"
          codesign -d --entitlements - macos/build/Diskbloom.app
      - name: Zip app
        run: cd macos/build && ditto -c -k --keepParent Diskbloom.app Diskbloom.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Diskbloom-macos
          path: macos/build/Diskbloom.zip
      - name: Trash path check
        run: swift macos/ci/trash-test.swift
      - name: Screenshots (smoke test)
        run: |
          APP=macos/build/Diskbloom.app
          OUT=macos/build/shots; mkdir -p $OUT
          # 1) disk overview with actions
          open --env DISKBLOOM_OVERVIEW=1 "$APP"
          sleep 12
          pgrep -x Diskbloom   # the app did not crash
          screencapture -x $OUT/1-overview.png
          pkill -x Diskbloom; sleep 2
          # 2) scan + Trash list
          open --env DISKBLOOM_DEMO=1 --env DISKBLOOM_SCAN="$HOME" "$APP"
          sleep 45
          pgrep -x Diskbloom
          screencapture -x $OUT/2-map.png
          # 3) click the second folder in the list -> it should open
          swift macos/ci/click.swift 800 202 || true
          sleep 3
          screencapture -x $OUT/3-after-click.png
          pkill -x Diskbloom || true; sleep 2
          # 4) Smart Clean under load: 6000 __pycache__ + a simulator + an emulator
          python3 - <<'PY'
          import os, plistlib
          h = os.path.expanduser("~")
          for i in range(6000):
              d = f"{h}/stress/p{i}/__pycache__"; os.makedirs(d, exist_ok=True)
              open(f"{d}/m.pyc", "wb").write(b"x" * 5000)
          sim = f"{h}/Library/Developer/CoreSimulator/Devices/0A1B2C3D-TEST"; os.makedirs(f"{sim}/data", exist_ok=True)
          plistlib.dump({"name": "iPhone 15 Pro", "runtime": "com.apple.CoreSimulator.SimRuntime.iOS-17-2"}, open(f"{sim}/device.plist", "wb"))
          open(f"{sim}/data/disk.img", "wb").write(b"x" * 3_000_000)
          avd = f"{h}/.android/avd/Pixel_8_API_34.avd"; os.makedirs(avd, exist_ok=True)
          open(f"{avd}/userdata.img", "wb").write(b"x" * 2_000_000)
          PY
          open --env DISKBLOOM_SCAN="$HOME" --env DISKBLOOM_CLEAN=1 "$APP"
          sleep 60
          pgrep -x Diskbloom
          screencapture -x $OUT/4-smart-clean.png
          pkill -x Diskbloom || true; sleep 2
          # 5) largest files and duplicates (a few copies)
          mkdir -p ~/dupes/a ~/dupes/b
          head -c 30000000 /dev/urandom > ~/dupes/a/video.mov
          cp ~/dupes/a/video.mov ~/dupes/b/video-copy.mov
          cat ~/dupes/a/video.mov > ~/dupes/video-backup.mov
          open --env DISKBLOOM_SCAN="$HOME" --env DISKBLOOM_MODE=largest "$APP"
          sleep 50
          pgrep -x Diskbloom
          screencapture -x $OUT/5-largest.png
          pkill -x Diskbloom || true; sleep 2
          open --env DISKBLOOM_SCAN="$HOME/dupes" --env DISKBLOOM_MODE=duplicates "$APP"
          sleep 15
          pgrep -x Diskbloom
          screencapture -x $OUT/6-duplicates.png
          pkill -x Diskbloom || true; sleep 2
          # 6) Serbian
          open --env DISKBLOOM_OVERVIEW=1 "$APP" --args -AppleLanguages "(sr)"
          sleep 12
          pgrep -x Diskbloom
          screencapture -x $OUT/7-overview-sr.png
          pkill -x Diskbloom || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: macos/build/shots
