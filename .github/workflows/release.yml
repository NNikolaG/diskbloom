name: Release

# Runs on a "v*" tag (git tag v0.2.0 && git push origin v0.2.0).
# Builds Diskbloom.dmg for Apple Silicon and publishes a GitHub Release.
# Free for public repositories; the app is not notarized (no Apple Developer account).

on:
  push:
    tags: ["v*"]
  # and when a release is published on GitHub (Releases -> Draft a new release)
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build app (Apple Silicon)
        run: ./macos/build.sh
      - name: Make DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/dmg
          cp -R macos/build/Diskbloom.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Diskbloom $VERSION" -srcfolder dist/dmg -ov -format UDZO "dist/Diskbloom-$VERSION.dmg"
          (cd macos/build && ditto -c -k --keepParent Diskbloom.app "../../dist/Diskbloom-$VERSION.zip")
          shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            1. Download **Diskbloom-${{ github.ref_name }}.dmg** below (the version number without `v`), open it and drag **Diskbloom** to **Applications**.
            2. Diskbloom is not notarized by Apple yet, so the first launch is blocked. Right-click the app → **Open** → **Open**, or run:
               ```
               xattr -dr com.apple.quarantine /Applications/Diskbloom.app
               ```
            3. For a complete scan, allow **Full Disk Access** in System Settings → Privacy & Security.

            Works on macOS 13 Ventura or newer, Macs with Apple Silicon (M1 or newer).
