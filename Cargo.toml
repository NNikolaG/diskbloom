[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/ffi"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/NNikolaG/diskbloom"

[workspace.dependencies]
diskbloom-core = { path = "crates/core" }

[profile.release]
lto = true
codegen-units = 1
